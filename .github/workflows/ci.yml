name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  bats:
    name: Bats (shell helpers)
    runs-on: rzv-ubuntu-24.04-x64-2vcpu-8gb
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: ./.github/actions/setup-ci
        with:
          tools: bats

      - name: Run Bats tests
        run: bash "${GITHUB_WORKSPACE}/scripts/ci/02-test.sh" bats

  nodejs:
    name: Node.js example
    uses: ./.github/workflows/example-nodejs.yml
    with:
      runner: rzv-ubuntu-24.04-x64-2vcpu-8gb

  python:
    name: Python example
    uses: ./.github/workflows/example-python.yml
    with:
      runner: rzv-ubuntu-24.04-x64-2vcpu-8gb

  golang:
    name: Go example
    uses: ./.github/workflows/example-golang.yml
    with:
      runner: rzv-ubuntu-24.04-x64-2vcpu-8gb

  docker:
    name: Docker example
    uses: ./.github/workflows/example-docker.yml
    with:
      runner: rzv-ubuntu-24.04-x64-2vcpu-8gb
