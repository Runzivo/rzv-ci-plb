name: Example Node.js

# Reusable workflow. ci.yml calls it on GitHub-hosted runners and
# runzivo.yml calls it on a Runzivo runner. To use it on its own, copy it
# and replace workflow_call with your triggers (push, pull_request).
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the job.
        type: string
        default: ubuntu-latest

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: examples/nodejs/.nvmrc
          # No dependencies to cache yet. Remove this line once you have some.
          package-manager-cache: false

      - name: Test
        env:
          REPORT_DIR: ${{ runner.temp }}/reports
        run: bash "${GITHUB_WORKSPACE}/examples/nodejs/ci/test.sh"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodejs-test-report
          path: ${{ runner.temp }}/reports
          if-no-files-found: ignore
          retention-days: 7
